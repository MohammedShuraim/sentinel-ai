# =============================================================================
# Sentellent — build → ECR → deploy to EC2
#
# Required GitHub Secrets:
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION, AWS_ACCOUNT_ID
#   EC2_HOST, EC2_USERNAME, EC2_SSH_KEY
#   EC2_HOST = SSH target (IP or domain). Not used for browser-facing URLs.
#
# Production browser URLs are FIXED to DuckDNS below (not derived from EC2_HOST).
# Stale NEXT_PUBLIC_* secrets containing the old Elastic IP are ignored/overridden.
#   EC2_APP_DIR  default /home/ec2-user/sentinel-ai/backend
# =============================================================================

name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
  BACKEND_REPO: sentellent-backend
  FRONTEND_REPO: sentellent-frontend
  IMAGE_TAG: ${{ github.sha }}
  EC2_APP_DIR: /home/ec2-user/sentinel-ai/backend

jobs:
  # ---------------------------------------------------------------------------
  # 1) Build & push images to Amazon ECR (runs on GitHub-hosted runners — not EC2)
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build and push ECR images
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      ecr_registry: ${{ steps.meta.outputs.ecr_registry }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image metadata
        id: meta
        run: |
          echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "ecr_registry=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Frontend NEXT_PUBLIC_* are baked in at image build time.
      # Always use production DuckDNS. Override any stale Elastic-IP secrets.
      - name: Resolve frontend public URLs
        id: urls
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: |
          PROD_API="http://sentellent007.duckdns.org:8000"
          PROD_SITE="http://sentellent007.duckdns.org:3000"
          API_URL="${NEXT_PUBLIC_API_URL:-$PROD_API}"
          SITE_URL="${NEXT_PUBLIC_SITE_URL:-$PROD_SITE}"
          if [[ "$API_URL" == *"13.205.212.143"* ]] || [[ -z "$API_URL" ]]; then
            echo "Forcing NEXT_PUBLIC_API_URL to DuckDNS (stale/empty secret ignored)"
            API_URL="$PROD_API"
          fi
          if [[ "$SITE_URL" == *"13.205.212.143"* ]] || [[ -z "$SITE_URL" ]]; then
            echo "Forcing NEXT_PUBLIC_SITE_URL to DuckDNS (stale/empty secret ignored)"
            SITE_URL="$PROD_SITE"
          fi
          echo "api_url=${API_URL}" >> "$GITHUB_OUTPUT"
          echo "site_url=${SITE_URL}" >> "$GITHUB_OUTPUT"
          echo "Using NEXT_PUBLIC_API_URL=${API_URL}"
          echo "Using NEXT_PUBLIC_SITE_URL=${SITE_URL}"

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_REPO }}:latest
            ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_REPO }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          provenance: false

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPO }}:latest
            ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPO }}:${{ env.IMAGE_TAG }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ steps.urls.outputs.api_url }}
            NEXT_PUBLIC_SITE_URL=${{ steps.urls.outputs.site_url }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          provenance: false

  # ---------------------------------------------------------------------------
  # 2) SSH to EC2, ECR login, compose pull + up, health-check
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Mint ECR password in CI and pass it over SSH so EC2 does not need AWS keys.
      - name: Get ECR login password
        id: ecr-pass
        run: |
          PASS="$(aws ecr get-login-password --region "${AWS_REGION}")"
          echo "::add-mask::${PASS}"
          echo "password=${PASS}" >> "$GITHUB_OUTPUT"

      # Avoid appleboy/scp-action: drone-scp opens multiple SSH connections
      # (tar → scp → mkdir → untar → cleanup) and commonly hangs for minutes
      # under SSH rate limits / dial timeouts. Ship the small deploy script
      # over the same single SSH session used to run it.
      - name: Encode deploy script
        id: deploy-script
        run: |
          echo "content_b64=$(base64 -w0 scripts/deploy-ec2.sh)" >> "$GITHUB_OUTPUT"

      # Deploy the immutable github.sha tag from this run (not :latest).
      # :latest is still pushed for manual convenience; production always pins the SHA.
      #
      # Inject deploy env via the remote script body (not appleboy `env`/`envs`).
      # Values are interpolated by GitHub Actions on the runner before SSH.
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          command_timeout: 15m
          script: |
            set -euo pipefail
            export ECR_REGISTRY="${{ env.ECR_REGISTRY }}"
            export ECR_PASSWORD="${{ steps.ecr-pass.outputs.password }}"
            export APP_DIR="${{ env.EC2_APP_DIR }}"
            export IMAGE_TAG="${{ env.IMAGE_TAG }}"
            export BACKEND_IMAGE="${{ env.ECR_REGISTRY }}/${{ env.BACKEND_REPO }}:${{ env.IMAGE_TAG }}"
            export FRONTEND_IMAGE="${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPO }}:${{ env.IMAGE_TAG }}"
            echo "Remote env check: ECR_REGISTRY=${ECR_REGISTRY} IMAGE_TAG=${IMAGE_TAG}"
            echo "${{ steps.deploy-script.outputs.content_b64 }}" | base64 -d > /tmp/sentellent-deploy-ec2.sh
            chmod +x /tmp/sentellent-deploy-ec2.sh
            /tmp/sentellent-deploy-ec2.sh
            rm -f /tmp/sentellent-deploy-ec2.sh
