services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sentellent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # No host port publish — backend reaches postgres via the Docker network
    # service name. Avoids clashing with a local Postgres on the host and
    # keeps the DB off the public interface in production-like runs.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sentellent
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentellent-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override host so the container reaches the postgres service by name.
      # Use URL-encoded password so special characters (e.g. @) stay valid.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD_URLENCODED}@postgres:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sentellent
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      # First boot downloads embedding weights into HF_HOME (~1–2 min cold)
      start_period: 180s

  # Optional: build/run with `docker compose --profile web up`
  frontend:
    profiles: ["web"]
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # Browser (not the container) calls the backend via the host-mapped port.
        # Do NOT use the Docker service name here — NEXT_PUBLIC_* is inlined into
        # client JS and must be reachable from the user's browser.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    container_name: sentellent-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sentellent
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  sentellent:
    driver: bridge

volumes:
  postgres_data:
