# =============================================================================
# Sentellent — production Compose (EC2 + Amazon RDS + ECR)
#
# Runs ONLY backend + frontend. Does NOT start a PostgreSQL container.
# Images are pulled from Amazon ECR (built by GitHub Actions — not on EC2).
# DATABASE_URL must point at Amazon RDS and comes from .env without override.
#
# Usage (CI sets BACKEND_IMAGE / FRONTEND_IMAGE to the commit SHA tag):
#   export BACKEND_IMAGE=.../sentellent-backend:<git-sha>
#   export FRONTEND_IMAGE=.../sentellent-frontend:<git-sha>
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Manual convenience (mutable): omit env vars to use :latest defaults below.
# =============================================================================

services:
  backend:
    image: ${BACKEND_IMAGE:-549596002797.dkr.ecr.ap-south-1.amazonaws.com/sentellent-backend:latest}
    container_name: sentellent-backend
    restart: unless-stopped
    # Runtime config (CORS_ORIGINS, FRONTEND_URL, GOOGLE_REDIRECT_URI, DATABASE_URL,
    # secrets) comes from host `.env`. Use DuckDNS values from `.env.prod.example`.
    env_file:
      - .env
    # Intentionally no DATABASE_URL / CORS overrides here — edit `.env` on EC2.
    ports:
      - "8000:8000"
    networks:
      - sentellent
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      # First boot downloads embedding weights into HF_HOME (~1–2 min cold)
      start_period: 180s

  frontend:
    image: ${FRONTEND_IMAGE:-549596002797.dkr.ecr.ap-south-1.amazonaws.com/sentellent-frontend:latest}
    container_name: sentellent-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sentellent
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  sentellent:
    driver: bridge
